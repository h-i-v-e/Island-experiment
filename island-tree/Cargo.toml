[workspace]

[package]
name = "island-tree"
version = "0.1.0"
edition = "2024"
description = "Deterministic procedural trees and a standalone Bevy visual laboratory"
license = "UNLICENSED"

[[bin]]
name = "tree-lab"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "3d",
    "bluenoise_texture",
    "png",
] }
bevy_egui = "0.42"
island-rs = { path = "../island-rs", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
