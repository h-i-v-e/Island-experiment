[package]
name = "planet-rs"
version = "0.1.0"
edition = "2024"
description = "Seeded spherical Delaunay meshes built by a plane-ordered incremental hull"
license = "UNLICENSED"

[dependencies]
glam = { version = "0.33.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
robust = "1.2.0"
uvunwrap = { version = "0.2.0", default-features = false, features = ["parallel"] }

[lints]
workspace = true
