[workspace]

[package]
name = "island-building"
version = "0.1.0"
edition = "2024"
description = "Deterministic procedural buildings and a standalone recipe studio"
license = "UNLICENSED"

[features]
default = []
bevy = ["dep:bevy"]
studio = ["bevy", "dep:bevy_egui", "dep:rfd"]

[[bin]]
name = "building-studio"
path = "src/main.rs"
required-features = ["studio"]

[dependencies]
motu = { package = "island-rs", path = "../island-rs", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10.9"
png = "0.18"
bevy = { version = "0.19.1", optional = true, default-features = false, features = ["3d", "ui", "png", "default_font", "multi_threaded"] }
bevy_egui = { version = "0.42", optional = true }
rfd = { version = "0.17.2", optional = true }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "warn"
pedantic = "warn"
