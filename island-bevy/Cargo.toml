[workspace]

[package]
name = "island-bevy"
version = "0.1.0"
edition = "2024"
description = "Bevy viewer for the deterministic Motu island generator"
license = "UNLICENSED"

[[bin]]
name = "island-bevy"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["3d", "ui"] }
island-rs = { path = "../island-rs" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
